name: CF Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install
        working-directory: sui2

      - name: Build
        run: npm run build
        working-directory: sui2
        env:
          DATA_FILE: ../data.json
          WEBMANIFEST_NAME: Reorx's Startpage
          WEBMANIFEST_SHORT_NAME: reorx-startpage
          WEBMANIFEST_DESCRIPTION: A startpage for self-hosted services and commonly used websites.

      - name: Publish
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sui2/dist --project-name=start
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
